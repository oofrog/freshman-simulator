<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>수강신청 목업</title>
<!--
  개발용 목업: 실제 수강신청 화면의 구조·흐름만 참고해 새로 작성. 과목·인물 데이터는 모두 가상.
  확장이 붙을 지점(메뉴 a[title], 버튼 value 문구, #gdMain 등)은 실제 화면과 같게 유지.
  알림 문구는 실제 문구를 확인하기 전까지 임시.
-->
<link rel="stylesheet" href="mock.css">
</head>
<body>
<div id="logo-area">
  <div class="left-area"><img src="hy_main_logo_ko.png" alt="한양대학교"><h2>2026년 겨울학기 수강신청</h2>
    <div class="quick-area">
      <label for="edQuickSuupNo">수업번호</label>
      <input type="text" id="edQuickSuupNo" size="7">
      <input type="button" id="btn_save_quick" class="blue" value="신청" data-act="quick">
    </div>
  </div>
  <div class="right-area">
    <span><b>학번:</b> 2026000000</span>
    <span><b>학년(반):</b> 1(3)</span>
    <span><b>성명:</b> 새내기</span>
    <a href="#" data-act="todo">로그아웃</a>
  </div>
</div>
<div id="wrap">
  <div id="snb">
    <ul id="menu"></ul>
    <div class="credits">
      <label>최소학점 <input id="edMinHakjeom" readonly></label>
      <label>최대학점 <input id="edMaxHakjeom" readonly></label>
      <label>신청학점 <input id="edSincheongHakjeom" readonly></label>
      <label>영어등급 <input readonly></label>
    </div>
  </div>
  <div id="content-wrap"><div id="hyinContents"></div></div>
</div>
<!-- 확장 아이콘 클릭 대신: extension/files.js의 파일을 차례로 불러오고 켜기/끄기 (data-sg라 차단 대상에서 빠짐) -->
<input type="button" id="dev-guide" value="🧪 확장 켜기/끄기" data-sg>

<dialog id="course-dialog" class="course-dialog" aria-labelledby="course-dialog-title" data-sg>
  <form method="dialog">
    <header class="course-dialog-header">
      <h2 id="course-dialog-title"></h2>
      <button class="course-dialog-cross" aria-label="닫기" autofocus></button>
    </header>
    <div class="course-dialog-content">
      <div id="course-dialog-body"></div>
      <div class="course-dialog-footer"><button class="course-dialog-close">닫기</button></div>
    </div>
  </form>
</dialog>
<script>
const ME = { dept: '소프트웨어학부', min: 10, max: 20, gyoyangMax: 10 }; // 26학번 1학년, 개강 전 교양 10학점 제한

const K = 'no code name type area dept year cls prof credit lec lab time room cap enrolled hope limit'.split(' ');
const C = [
  ['10101', 'SWE1001', '프로그래밍기초', '전공기초', '', '소프트웨어학부', 1, 1, '김하늘', 3, 2, 2, '월(09:00-11:00) 수(09:00-11:00)', '공학관 301호', 45, 0, 52, '1학년 허용 / 소프트웨어학부만'],
  ['10102', 'SWE1001', '프로그래밍기초', '전공기초', '', '소프트웨어학부', 1, 2, '김하늘', 3, 2, 2, '화(13:00-15:00) 목(13:00-15:00)', '공학관 301호', 45, 0, 38, '1학년 허용 / 소프트웨어학부만'],
  ['10103', 'SWE1002', '이산수학', '전공기초', '', '소프트웨어학부', 1, 1, '이도윤', 3, 3, 0, '화(09:00-10:30) 목(09:00-10:30)', '공학관 205호', 60, 0, 64, ''],
  ['10104', 'SWE1003', '컴퓨터과학개론', '전공핵심', '', '소프트웨어학부', 1, 1, '박서연', 3, 3, 0, '월(13:00-14:30) 수(13:00-14:30)', '공학관 402호', 60, 0, 57, ''],
  ['20001', 'GEN1001', '대학글쓰기', '교양필수', '기초영역', '교양교육센터', 1, 3, '최민지', 2, 2, 0, '금(10:00-12:00)', '인문관 110호', 35, 0, 40, '1학년 허용 / 3반 대상'],
  ['20002', 'GEN1002', 'AI와사고', '교양필수', '기초영역', '교양교육센터', 1, 3, '한지호', 2, 2, 0, '목(15:00-17:00)', '공학관 PC실', 40, 0, 41, ''],
  ['20003', 'GEN1003', '영어회화1', '교양필수', '기초영역', '교양교육센터', 1, 3, 'Emily Park', 2, 2, 0, '화(15:00-17:00)', '국제관 204호', 25, 1, 27, '영어등급별 반 배정'],
  ['30001', 'GEN2101', '영화로읽는심리학', '교양선택', '인간이해영역', '교양교육센터', 1, 1, '문수아', 3, 3, 0, '월(10:30-12:00) 수(10:30-12:00)', '인문관 201호', 40, 31, 176, ''],
  ['30002', 'GEN2102', '생활속의경제학', '교양선택', '사회이해영역', '교양교육센터', 1, 1, '이서준', 3, 3, 0, '화(10:30-12:00) 목(10:30-12:00)', '경상관 201호', 50, 12, 64, ''],
  ['30003', 'GEN2103', '테니스', '교양선택', '자기인식영역', '교양교육센터', 1, 1, '오지훈', 2, 0, 2, '월(11:00-13:00)', '테니스장', 30, 30, 88, ''],
  ['30004', 'GEN2104', '미술과치유', '교양선택', '예술영역', '교양교육센터', 1, 1, '윤채원', 2, 2, 0, '수(15:00-17:00)', '예술관 302호', 25, 16, 140, ''],
  ['30005', 'GEN2105', '창업아이디어발상', '교양선택', '미래기술영역', '교양교육센터', 1, 1, '장민호', 3, 3, 0, '금(13:00-16:00)', '창업센터 세미나실', 60, 5, 30, ''],
  ['30006', 'GEN2106', '데이터시각화입문', '교양선택', '미래기술영역', '교양교육센터', 1, 1, '서지안', 3, 2, 2, '목(09:00-12:00)', '공학관 PC실', 40, 22, 95, ''],
  ['30007', 'GEN2107', '세계사의장면들', '교양선택', '역사영역', '교양교육센터', 1, 1, '임도현', 3, 3, 0, '월(15:00-16:30) 수(15:00-16:30)', '인문관 305호', 80, 44, 70, ''],
  ['40001', 'BUS1001', '경영학원론', '전공기초', '', '경영학부', 1, 1, '강예린', 3, 3, 0, '화(09:00-10:30) 목(09:00-10:30)', '경상관 101호', 70, 0, 85, '경영학부 1학년만 허용'],
  ['40002', 'DES1001', '디자인씽킹', '전공기초', '', '디자인학부', 1, 1, '조하은', 3, 1, 2, '금(09:00-12:00)', '디자인관 201호', 30, 0, 26, ''],
].map(r => Object.fromEntries(K.map((k, i) => [k, r[i]])));
const byNo = Object.fromEntries(C.map(c => [c.no, c]));

let hope = ['30001', '30004', '30006', '30007', '10101', '10102', '30002']; // A안·B안 섞어 담아 둔 상태
const selectedHope = new Set(hope);
let done = ['20003']; // 이미 1과목 신청된 상태 (신청내역·수강취소 화면 확인용)
const found = {}, query = {}; // 페이지별 조회 결과·조건 (화면 이동해도 유지)
const sum = type => done.map(n => byNo[n]).filter(c => !type || c.type.startsWith(type)).reduce((s, c) => s + c.credit, 0);

// ---------- 표 열 정의 ----------
const btn = (v, act, c, cls = '') => `<input type="button" class="${cls}" value="${v}" data-act="${act}" data-no="${c.no}">`;
const col = {
  check: [() => `<input type="checkbox" id="chooseAll" aria-label="희망수업 전체 선택"${hope.length && hope.every(n => selectedHope.has(n)) ? ' checked' : ''}>`, c => `<input type="checkbox" name="editBox" value="${c.no}" aria-label="${escapeAttr(c.name)} 선택"${selectedHope.has(c.no) ? ' checked' : ''}>`],
  order: ['정렬순서', (c, i) => `<select class="orderSeq" aria-label="${escapeAttr(c.name)} 정렬순서">${hope.map((_, j) => `<option${i === j ? ' selected' : ''}>${j + 1}</option>`).join('')}</select>`],
  apply: ['수강신청', c => btn('신청', 'apply', c, 'blue')],
  increase: ['증원신청', () => ''],
  increaseTarget: ['증원신청 대상자', () => ''],
  hopeApply: ['수강신청', c => done.includes(c.no) ? '' : btn('신청', 'apply', c, 'blue')], // 실제 희망수업은 이미 신청한 과목에 [신청]이 없다
  hopeAdd: ['희망신청', c => btn('추가', 'hopeAdd', c)],
  hopeDel: ['희망수업 삭제', c => btn('희망삭제', 'hopeDel', c)],
  cancel: ['수강취소', c => btn('수강취소', 'cancel', c)],
  year: ['학년', c => c.year], cls: ['반', c => c.cls],
  type: ['이수구분', c => c.type], area: ['영역', c => c.area],
  no: ['수업번호', c => c.no], code: ['학수번호', c => c.code], name: ['교과목명', c => c.name],
  prof: ['교강사', c => c.prof], credit: ['학점', c => c.credit], lec: ['강의', c => c.lec], lab: ['실습', c => c.lab],
  seat: ['수강/<br>정원', c => `${c.enrolled}/${c.cap}`],
  enrolled: ['신청인원', c => c.enrolled], cap: ['제한인원', c => c.cap], hope: ['희망인원', c => c.hope],
  retake: ['재수강<br>여부', () => 'N'],
  applied: ['신청<br>구분', c => done.includes(c.no) ? 'Y' : 'N'],
  retakeCode: ['재수강 학수번호', () => ''],
  retakeName: ['재수강 교과목명', () => ''],
  time: ['수업시간', c => c.time ? `<button type="button" class="course-link course-time" data-act="timetable" data-no="${c.no}">${escapeAttr(c.time).replace(/\) /g, ')<br>')}</button>` : ''], room: ['강의실', c => c.room],
  limit: ['이수제한<br>여부', c => c.limit ? `<a href="#" data-act="limit" data-no="${c.no}">O</a>` : ''],
  dept: ['설강학과', c => c.dept],
  unit: ['이수단위', () => ''], old: ['(변경전)교과목명', c => c.old || ''],
  preview: ['강좌 미리보기', () => ''], notice: ['과목안내', () => ''],
  accreditation: ['공학인증<br>구분', () => ''], degree: ['학위과정', () => '학사'],
  format: ['강좌유형', () => '일반'], mode: ['수업형태', () => ''],
  detail: ['과목상세 정보', c => `${c.no === '20002' ? 'HY-LIVE ' : ''}<button type="button" class="course-detail-button" aria-label="과목 상세 정보" data-act="courseDetail" data-no="${c.no}"><svg aria-hidden="true" viewBox="0 0 16 16"><circle cx="6.5" cy="6.5" r="3.5"/><path d="m9 9 4 4"/></svg></button>`], competency: ['6C핵심역량', () => ''],
  manager: ['관장학과', c => c.dept],
};
// 'hidden': 실제 수강신청 표처럼 머리글 없는 숨김 칸(td.hidden-type) 3개를 끼워 넣음 → 확장이 칸 위치를 제대로 세는지 확인용
const cellHtml = (k, c, i) => k === 'hidden' ? '<td class="hidden-type">1</td>'.repeat(3) : `<td>${col[k][1](c, i)}</td>`;
const catalogCols = 'year cls type unit area no code old name preview notice accreditation degree prof credit lec lab format seat mode time room limit detail competency dept manager'.split(' ');
const catalogWidths = [28,20,52,52,55,69,87,135,134,47,73,44,42,73,19,18,19,59,46,61,94,82,64,95,73,74,108];
const applyCols = ['apply', 'increase', 'increaseTarget', 'hidden', ...catalogCols.flatMap(k => k === 'preview' ? [k, 'hopeAdd'] : [k])];
const applyWidths = [58,58,112, ...catalogCols.flatMap((k, i) => k === 'preview' ? [catalogWidths[i], 64] : [catalogWidths[i]])];
const hopeCols = 'check order hopeApply enrolled cap hope type unit area no code name notice hopeDel applied retake retakeCode retakeName degree prof credit lec lab format time room limit detail dept manager'.split(' ');
const hopeWidths = [30,67,61,40,40,40,58,42,59,66,94,144,85,77,35,35,52,56,30,48,23,22,22,43,105,115,45,92,85,90];
const doneCols = 'cancel type unit area no code name notice accreditation retake retakeCode retakeName degree prof credit lec lab format seat time room detail dept manager'.split(' ');
const doneWidths = [76,54,48,58,73,93,145,74,48,43,58,61,42,60,22,22,22,49,54,100,112,103,88,100];
const basicCols = 'apply increase increaseTarget year cls type unit no code name notice accreditation degree prof credit lec lab format seat time room limit detail dept manager'.split(' ');
const basicSubCols = basicCols.filter(k => k !== 'unit');
const basicWidths = [49,49,72,27,21,55,55,63,75,145,68,58,52,70,22,22,22,61,49,93,122,60,85,91,92];
const otherWidths = { check: 32, order: 75, year: 32, cls: 24, name: 140, time: 135, room: 125, dept: 100 };
const grid = (keys, rows, id = 'gdMain') => {
  const visible = keys.filter(k => k !== 'hidden');
  const isBasic = keys === basicCols || keys === basicSubCols;
  const widths = keys === catalogCols ? catalogWidths : keys === applyCols ? applyWidths : keys === hopeCols ? hopeWidths : keys === doneCols ? doneWidths : isBasic ? basicCols.flatMap((k, i) => visible.includes(k) ? [basicWidths[i]] : []) : visible.map(k => otherWidths[k] || 72);
  const totalWidth = widths.reduce((a, b) => a + b, 0);
  return `<div class="grid-wrap" tabindex="0" aria-label="과목 목록"><table id="${id}" class="grid${isBasic ? ' basic-grid' : ''}" style="width:${isBasic ? '100%;min-width:' + totalWidth : totalWidth}px">
  <colgroup>${widths.map(w => `<col style="width:${isBasic ? (w / totalWidth * 100) + '%' : w + 'px'}">`).join('')}</colgroup>
  <thead><tr>${visible.map(k => `<th scope="col">${typeof col[k][0] === 'function' ? col[k][0]() : col[k][0]}</th>`).join('')}</tr></thead>
  <tbody>${rows.length ? rows.map((c, i) => `<tr data-no="${c.no}">${keys.map(k => cellHtml(k, c, i)).join('')}</tr>`).join('')
    : `<tr><td class="empty emptyDataList" colspan="${visible.length}"${isBasic ? ' aria-label="등록된 과목 없음"' : ''}>${isBasic ? '' : '조회를 하지 않았거나 조회된 데이터가 없습니다.'}</td></tr>`}</tbody>
  ${rows.length ? '' : `<tfoot aria-hidden="true"><tr><td colspan="${visible.length}"></td></tr></tfoot>`}</table></div>
  ${isBasic ? '' : '<div class="grid-rail"><button type="button" aria-label="표 왼쪽으로 이동" data-scroll="-1">◀</button><button type="button" aria-label="표 오른쪽으로 이동" data-scroll="1">▶</button></div>'}`;
};

const opts = (list, v) => list.map(o => `<option${o === v ? ' selected' : ''}>${o}</option>`).join('');
const escapeAttr = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const courseGroups = ['전체', '공통과목(교양)', '학과과목(전공)', '핵심/특화 프로그램'];
const searchBox = (page, q = query[page] || {}) => `<div class="search-box" data-page="${page}">
  <div class="search-row">
    <label class="first-filter">조직 <select id="cbJojikGbCd"><option>대학(학부/ERICA)</option></select></label>
    <label class="year-filter">년도 <input type="number" id="cbYear" name="year" style="width:83px" value="${escapeAttr(q.year ?? 2026)}"></label>
    <label class="term-filter">학기 <select id="cbTerm" name="term">${opts(['1학기','여름학기','2학기','겨울학기'], q.term || '겨울학기')}</select></label>
    <label class="grade-filter">학년 <select id="cbGrade" name="grade">${opts(['전체','1','2','3','4','5','전학년'], q.grade)}</select></label>
    <span class="special-filters">특수강좌 ${['영어강의','E-러닝','SMART-F·B','PBL','산학협력영역'].map((label, i) => `<label><input type="checkbox" name="special" value="${i}"${q.special?.includes(String(i)) ? ' checked' : ''}> ${label}</label>`).join('')}</span>
    ${page === 'apply' ? `<div class="course-groups" role="group" aria-label="과목구분">${courseGroups.map(label => `<label><input type="radio" name="gubun" value="${escapeAttr(label)}"${label === (q.gubun || '전체') ? ' checked' : ''}> ${label}</label>`).join('')}</div>` : ''}
  </div>
  <div class="search-row">
  <label class="first-filter">이수구분 <select id="cbIsuGb" name="type">${opts(['전체', '교양필수', '교양선택', '전공기초', '전공핵심'], q.type)}</select></label>
  <label class="code-filter">학수번호 <input id="cbHaksu" name="code" style="width:128px" value="${escapeAttr(q.code)}"></label>
  <label class="old-filter">(변경전)교과목명 <input id="cbChgGwamokNm" name="old" style="width:146px" value="${escapeAttr(q.old)}"></label>
  <label class="name-filter">교과목명 <input id="cbGwamokNm" name="name" style="width:146px" value="${escapeAttr(q.name)}"></label>
  <input type="button" value="▼ 상세조회" data-detail aria-controls="mock-search-detail" aria-expanded="${!!q.detail}">
  <div class="search-actions">
    <input type="button" id="btn_Refresh" value="초기화" data-act="reset">
    <input type="button" id="btn_Find" class="blue" value="조  회" data-act="search">
  </div>
  </div>
  <div class="search-detail" id="mock-search-detail" ${q.detail ? '' : 'hidden'}>
  ${page === 'apply' ? '<span>과목구분과 특수강좌 조건을 함께 선택해 조회할 수 있습니다.</span>' : `<label>과목구분 <select name="gubun">${opts(courseGroups.slice(0, 3), q.gubun)}</select></label>`}
  </div>
</div>`;
const gridHint = '<p class="grid-hint">수업번호 클릭시 <b>강의계획서 조회</b>, 학수번호 클릭시 <b>교과목 개요서 조회</b>가 가능합니다</p>';

// ---------- 화면 ----------
const PAGES = [
  ['pyunram', '수강편람', () => searchBox('pyunram') + gridHint + grid(catalogCols, found.pyunram || [])],
  ['guide', '수강안내', () => '<p>목업에서는 생략. 실제 수강안내 내용은 CLAUDE.md의 "학교 수강신청 규칙" 참고.</p>'],
  ['basic', '기본수업', () => `<div class="basic-toolbar">${gridHint}
    <input type="button" id="btn_dongil" value="동일/대치 교과목 확인" data-act="dongil"></div>
    <section class="basic-section" aria-labelledby="basic-heading"><h4 id="basic-heading">기본수업조회</h4>
    ${grid(basicCols, C.filter(c => c.type === '교양필수' || (c.dept === ME.dept && c.year === 1)))}</section>
    <section class="basic-section" aria-labelledby="basic-sub-heading"><h4 id="basic-sub-heading">타학과전공인정교과목</h4>
    ${grid(basicSubCols, [], 'gdSub')}</section>`],
  ['apply', '수강신청', () => searchBox('apply') + gridHint + grid(applyCols, found.apply || [])],
  ['hope', '희망수업', () => `<div class="toolbar hope-toolbar">
      <input type="button" id="btn_siganpyo" class="hope-action" value="선택과목 시간표보기" data-act="hopeTimetable">
      <input type="text" id="edGwamok" size="2" readonly value="${hope.length}"> 과목 /
      <input type="text" id="edHakjeom" size="2" readonly value="${hope.reduce((s, n) => s + byNo[n].credit, 0)}"> 학점</div>
    <p class="hope-notice">◎ 희망수업추가 이후에 시간표, 이수제한이 변경될 수도 있으므로, 반드시 수강신청 전에 최종확인을 하시기 바랍니다.</p>
    ${gridHint}
    <div class="toolbar hope-sort"><input type="button" id="btn_save" class="hope-action" value="정렬순서저장" data-act="orderSave"></div>`
    + grid(hopeCols, hope.map(n => byNo[n]))],
  ['done', '신청내역', () => `<div class="done-toolbar">
      <div>
        <p class="grid-hint done-warning"><strong>재수강 여부 및 적용 이수구분(다전공생은 적용 예정 이수구분)을 반드시 확인하시기 바랍니다.</strong></p>
        <p class="grid-hint">아래 신청내역에는 사회봉사과목은 포함되어 있지 않습니다.</p>
      </div>
      <input type="button" class="hope-action" value="신청과목시간표확인(고지서출력)" data-act="doneTimetable">
    </div>` + grid(doneCols, done.map(n => byNo[n]))],
];
const FIRST = 'pyunram'; // 첫 화면 (실제 로그인 직후 화면은 확인 필요)

const extraPages = [
  ['increase', '증원신청내역'], ['graduation', '졸업사정조회'], ['combined', '학석사공통신청'],
  ['volunteer', '사회봉사'], ['international', '국제여름/겨울학교'], ['keyword', '키워드검색'],
];
for (const [key, title] of extraPages) PAGES.push([key, title, () => '<p>이 메뉴는 연습용 목업에서 제공하지 않습니다.</p>']);
document.getElementById('menu').innerHTML = PAGES.map(([k, t]) => `<li><a href="#!${k}" title="${t}">${t}</a></li>`).join('');

function render() {
  const key = location.hash.slice(2);
  const [k, title, view] = PAGES.find(p => p[0] === key) || PAGES.find(p => p[0] === FIRST);
  document.querySelectorAll('#menu a').forEach(a => a.classList.toggle('on', a.title === title));
  document.getElementById('hyinContents').innerHTML = `<div class="header"><h3 class="txt_title">${title}</h3></div><div class="hyinTemplate">${view()}</div>`;
  edMinHakjeom.value = ME.min; edMaxHakjeom.value = ME.max; edSincheongHakjeom.value = sum();
}
addEventListener('hashchange', render);

// ---------- 동작 ----------
function apply(c) {
  if (!c) return alert('해당 수업번호가 없습니다.');
  if (done.some(n => byNo[n].code === c.code)) return alert('이미 신청한 과목입니다.');
  if (c.enrolled >= c.cap) return alert('정원이 초과되었습니다.');
  if (sum() + c.credit > ME.max) return alert(`최대 신청학점(${ME.max}학점)을 초과합니다.`);
  if (c.type.startsWith('교양') && sum('교양') + c.credit > ME.gyoyangMax) return alert(`개강 전에는 교양을 최대 ${ME.gyoyangMax}학점까지 신청할 수 있습니다.`);
  // ponytail: 시간 중복 검사는 생략. 실전 재현 기능(가짜 모달)에서 다룰 예정
  c.enrolled++; done.push(c.no);
  alert('신청되었습니다.');
}

const courseDialog = document.getElementById('course-dialog');
const dialogTable = (headers, widths, rows) => `<table class="course-dialog-table">
  <colgroup>${widths.map(w => `<col style="width:${w}%">`).join('')}</colgroup>
  <thead><tr>${headers.map(h => `<th scope="col">${escapeAttr(h)}</th>`).join('')}</tr></thead>
  <tbody>${rows}</tbody></table>`;
const dialogCells = cells => `<tr>${cells.map(value => `<td>${escapeAttr(value)}</td>`).join('')}</tr>`;
function openCourseDialog(kind, title, body) {
  courseDialog.dataset.kind = kind;
  document.getElementById('course-dialog-title').textContent = title;
  document.getElementById('course-dialog-body').innerHTML = body;
  courseDialog.showModal();
}
function showCourseLimit(c) {
  const rule = {
    '10101': [['ERICA 대학 (그 외 소속)', [1,2,3,4,5]], ['소프트웨어학부', [2,3,4,5]]],
    '10102': [['ERICA 대학 (그 외 소속)', [1,2,3,4,5]], ['소프트웨어학부', [2,3,4,5]]],
    '20001': [['ERICA 대학', [2,3,4,5]]],
    '40001': [['ERICA 대학 (그 외 소속)', [1,2,3,4,5]], ['경영학부', [2,3,4,5]]],
  }[c.no] || [];
  const rows = rule.length ? rule.map(([dept, grades]) => dialogCells([dept, ...[1,2,3,4,5].map(n => grades.includes(n) ? '제한' : '')])).join('')
    : '<tr><td colspan="6">학년별 제한 정보 없음</td></tr>';
  openCourseDialog('limit', '이수제한여부', dialogTable(['적용 대상 소속','1학년','2학년','3학년','4학년','5학년'], [32,13.6,13.6,13.6,13.6,13.6], rows)
    + `<p class="grid-hint course-dialog-note">${escapeAttr(c.limit)}<br>위 표는 연습용 설정이며 실제 이수제한은 학교 안내를 확인해 주세요.</p>`);
}
function courseTimeTable(c) {
  // 캡처처럼 16주를 표시하는 모의 시간표. 실제 학사일정과 연결되지 않는다.
  const dayNames = '월화수목금토일';
  const slots = [...c.time.matchAll(/([월화수목금토일])\((\d{2}:\d{2}-\d{2}:\d{2})\)/g)];
  const rows = Array.from({ length: 16 }, (_, week) => slots.map(([,day,time]) => {
    const date = new Date(Date.UTC(2026, 7, 31 + week * 7 + dayNames.indexOf(day)));
    return dialogCells([week + 1, c.lec ? '이론' : '실습', date.toISOString().slice(0, 10).replace(/-/g, '.'), day, time, c.prof]);
  }).join('')).join('');
  return dialogTable(['주(회)차','수업구분','날짜','요일','시간','교강사'], [10,12.5,21,9,26.5,21], rows || '<tr><td colspan="6">표시할 수업 시간이 없습니다.</td></tr>');
}
function showCourseTime(c) { openCourseDialog('timetable', '수업 시간표', courseTimeTable(c)); }
function weeklyCourseTable(courses) {
  const weekdays = ['월', '화', '수', '목', '금', '토', '일'];
  const minutes = value => { const [h, m] = value.split(':').map(Number); return h * 60 + m; };
  const slots = courses.flatMap((course, color) => [...course.time.matchAll(/([월화수목금토일])\((\d{2}:\d{2})-(\d{2}:\d{2})\)/g)]
    .map(([, day, from, to]) => ({ course, color, day, from, to, start: minutes(from), end: minutes(to) })))
    .filter(slot => slot.end > slot.start);
  if (!slots.length) return '<p>선택한 과목에 표시할 수업 시간이 없습니다.</p>';
  const days = weekdays.slice(0, Math.max(5, ...slots.map(s => weekdays.indexOf(s.day) + 1)));
  const start = Math.floor(Math.min(9 * 60, ...slots.map(s => s.start)) / 60);
  const end = Math.ceil(Math.max(18 * 60, ...slots.map(s => s.end)) / 60);
  const hours = Array.from({ length: end - start }, (_, i) => start + i);
  const origin = start * 60;
  return `<div class="weekly-scroll" tabindex="0" aria-label="주간 시간표 영역">
    <div class="weekly-grid" style="--days:${days.length};--hours:${hours.length}">
      <div class="weekly-heading">시간</div>${days.map(day => `<div class="weekly-heading">${day}</div>`).join('')}
      <div class="weekly-axis">${hours.map(h => `<div>${String(h).padStart(2, '0')}:00</div>`).join('')}</div>
      ${days.map(day => {
        const items = slots.filter(s => s.day === day).sort((a, b) => a.start - b.start || a.end - b.end);
        const laneEnds = [];
        const placed = items.map(slot => {
          const free = laneEnds.findIndex(end => end <= slot.start);
          const lane = free < 0 ? laneEnds.length : free;
          laneEnds[lane] = slot.end;
          return { ...slot, lane };
        });
        return `<div class="weekly-day" role="group" aria-label="${day}요일">${placed.map(s => `<div class="weekly-course weekly-color-${s.color % 5}" style="--start:${s.start - origin};--duration:${s.end - s.start};--lane:${s.lane};--lanes:${laneEnds.length}" title="${escapeAttr(s.course.name)} · ${s.from}–${s.to} · ${escapeAttr(s.course.room)}"><strong>${escapeAttr(s.course.name)}</strong><span>${s.from}–${s.to}</span><span>${escapeAttr(s.course.room)}</span></div>`).join('')}</div>`;
      }).join('')}
    </div>
  </div>`;
}
function showCourseDetail(c) {
  const rows = dialogCells(['일반','등급(ABCDEF)','N','N',''])
    + `<tr><th scope="row">특수강좌</th><td colspan="4" class="course-detail-text">${c.no === '20002' ? 'HY-LIVE' : ''}</td></tr><tr><th scope="row">설명</th><td colspan="4" class="course-detail-text"></td></tr>`;
  openCourseDialog('detail', '과목 상세 정보', dialogTable(['강좌유형','성적부여형태','공학인증과목','교직과목','비고'], [15,42,15,15,13], rows));
}
const courseViews = { limit: showCourseLimit, timetable: showCourseTime, courseDetail: showCourseDetail };

const ACT = {
  apply: c => apply(c),
  quick: () => apply(byNo[edQuickSuupNo.value.trim()]),
  hopeAdd: c => hope.includes(c.no) ? alert('이미 희망수업에 담긴 과목입니다.') : (hope.push(c.no), selectedHope.add(c.no), c.hope++, alert('희망수업에 추가되었습니다.')),
  hopeDel: c => { hope = hope.filter(n => n !== c.no); selectedHope.delete(c.no); c.hope--; },
  cancel: c => { if (confirm(`${c.name} 수강을 취소하시겠습니까?`)) { done = done.filter(n => n !== c.no); c.enrolled--; } },
  orderSave: () => {
    // 번호를 고른 과목이 앞으로, 안 고른 과목은 기존 순서대로 뒤에
    const rank = [...document.querySelectorAll('.orderSeq')].map((s, i) => [hope[i], s.value ? +s.value : 99 + i]);
    hope = rank.sort((a, b) => a[1] - b[1]).map(r => r[0]);
    alert('정렬순서가 저장되었습니다.');
  },
  dongil: () => alert('동일/대치 교과목으로 지정된 이수 과목이 없습니다.'),
  todo: () => alert('목업에서는 아직 지원하지 않는 기능입니다.'),
  reset: (_, el) => { const page = el.closest('.search-box').dataset.page; delete query[page]; delete found[page]; },
  search: (_, el) => {
    const box = el.closest('.search-box'), f = n => (box.querySelector(`[name=${n}]:checked`) || box.querySelector(`[name=${n}]`)).value.trim();
    const special = [...box.querySelectorAll('[name=special]:checked')].map(input => input.value);
    query[box.dataset.page] = { gubun: f('gubun'), type: f('type'), code: f('code'), name: f('name'), old: f('old'), year: f('year'), term: f('term'), grade: f('grade'), special, detail: !box.querySelector('.search-detail').hidden };
    found[box.dataset.page] = C.filter(c =>
      f('year') === '2026' && f('term') === '겨울학기' &&
      (f('grade') === '전체' || String(c.year) === f('grade')) &&
      (!special.length || special.some(tag => c.special?.includes(tag))) &&
      (c.old || '').includes(f('old')) &&
      (f('gubun') === '전체' ||
        (f('gubun') === '공통과목(교양)' && c.type.startsWith('교양')) ||
        (f('gubun') === '학과과목(전공)' && c.type.startsWith('전공')) ||
        (f('gubun') === '핵심/특화 프로그램' && c.program)) &&
      (f('type') === '전체' || c.type === f('type')) &&
      c.code.includes(f('code').toUpperCase()) && c.name.includes(f('name')));
  },
};

document.addEventListener('change', e => {
  const input = e.target;
  if (input.id === 'chooseAll') {
    document.querySelectorAll('input[name=editBox]').forEach(box => { box.checked = input.checked; });
    selectedHope.clear();
    if (input.checked) hope.forEach(no => selectedHope.add(no));
  } else if (input.matches('input[name=editBox]')) {
    if (input.checked) selectedHope.add(input.value);
    else selectedHope.delete(input.value);
    document.getElementById('chooseAll').checked = hope.every(no => selectedHope.has(no));
  }
});
document.addEventListener('click', e => {
  const detail = e.target.closest('[data-detail]');
  if (detail) {
    const panel = detail.closest('.search-box').querySelector('.search-detail');
    panel.hidden = !panel.hidden;
    detail.setAttribute('aria-expanded', String(!panel.hidden));
    return;
  }
  const scroll = e.target.closest('[data-scroll]');
  if (scroll) {
    scroll.closest('.grid-rail').previousElementSibling.scrollBy({left: 240 * Number(scroll.dataset.scroll)});
    return;
  }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  e.preventDefault();
  if (el.dataset.act === 'hopeTimetable') {
    const courses = hope.filter(no => selectedHope.has(no)).map(no => byNo[no]);
    openCourseDialog('weekly', '선택과목 시간표', courses.length
      ? weeklyCourseTable(courses)
      : '<p>시간표를 볼 과목을 선택해 주세요.</p>');
    return;
  }
  if (el.dataset.act === 'doneTimetable') {
    const courses = done.map(no => byNo[no]);
    openCourseDialog('weekly', '신청과목 시간표', courses.length ? weeklyCourseTable(courses) : '<p>신청한 과목이 없습니다.</p>');
    return;
  }
  if (Object.hasOwn(courseViews, el.dataset.act)) {
    const course = byNo[el.dataset.no];
    if (course) courseViews[el.dataset.act](course);
    return;
  }
  ACT[el.dataset.act](byNo[el.dataset.no], el);
  render();
});

async function devToggle() {
  if (!window.SG) {
    const load = src => new Promise((ok, fail) => document.body.append(Object.assign(document.createElement('script'), { src, onload: ok, onerror: fail })));
    await load('../extension/files.js');
    for (const f of SG_FILES) await load('../extension/' + f);
  }
  SG.toggle();
}
document.getElementById('dev-guide').addEventListener('click', devToggle);
// ?sg → 열자마자 확장 켜기, ?sg=practice 처럼 모드 이름을 주면 그 모드까지 시작 (자동 새로고침과 같이 쓰기)
const autoMode = new URLSearchParams(location.search).get('sg');
if (autoMode !== null) devToggle().then(() => autoMode && SG.start(autoMode));

render();
</script>
